; RE5 Control Plus 1.9.4-beta.1 / RE3Controls v1.9 中文注释配置
; 适用 Steam 生化危机 5 黄金版 1.2.0，32 位 re5dx9.exe。
; 只改等号右侧的值；英文分区名、参数名、选项值不要翻译。
; 1 = 开启，0 = 关闭（倍率与 FPS 等特殊数字项请看对应注释）。
; 小数使用英文句点。注释单独一行，不要写在参数值后面。
; 保存后通常约一秒热更新；HookDelayMs 改后需要重启游戏。
; 完整说明：RE3Controls_完整中文说明.md。本文件数值保留原整合包预设。

[Controls]
; 总开关；0 停用 mod 功能，包括本版限帧修改和去黄滤镜。
Enabled=1
; Full = 完整功能；MeleeCamera = 仅体术自由镜头模式。
; 体术专用模式不应用 FOV 和滚轮切枪，但 FPSLimit 与去黄仍单独控制。
Mode=Full
; 手柄 RE3 布局：A 互动、X 换弹、Back 地图、L3 跑步、R3 相机回正。
; 0 恢复游戏布局；若不要 X 额外换弹，还需 OneButtonReload=0。
RemapButtons=1
; 手柄跑步：Toggle 按一下切换，Hold 按住，Stock 原作方式。
; 键盘跑步另见 [Keyboard] Run。
Run=Toggle
; 手柄跑步键：L3 或 RB；RB 会让 L3 改为定位同伴/瞄准换肩。
RunButton=L3
; 手柄互动：A 或 X。X 模式有提示时互动、无提示时换弹；QTE 不变。
InteractButton=A
; 单键换弹：手柄 X / 游戏键盘换弹键，无须先举枪。
OneButtonReload=1
; 快速转身：手柄 B + 向相机方向拉摇杆；键盘默认 C。
QuickTurn=1
; 威斯克佣兵冲刺：非瞄准 R3 发动，保留原生转向；键盘默认 Shift+X。
WeskerDash=1
; 保留 R3+L3 挑衅、瞄准时 R3 原生动作（如夜视）；威斯克冲刺单独设置。
StickClicks=1
; 按住枪械瞄准时，按持刀键可直接切刀，释放后回到枪械瞄准。
KnifeFromAim=1
; 打开背包仍可移动；手柄用十字键选物品，键鼠用鼠标操作物品。
InventoryMove=1

[Camera]
; 自由过肩相机，角色按相机方向移动；0 使用原作相机/移动方式。
FreeCamera=1
; 手柄自由相机水平速度，度/秒；鼠标另调 MouseSensitivity。
Speed=180
; 手柄自由相机纵向速度，度/秒。
PitchSpeed=90
; 反转手柄自由相机纵向；鼠标反转在游戏选项中设置。
InvertY=0
; 普通自由相机离肩部旋转支点的后方距离，厘米；越大越远。
Distance=230
; 相机旋转支点距脚下高度，厘米。
Height=150
; 相机向肩侧偏移，厘米；瞄准时可用定位同伴键换肩。
Shoulder=45
; 相机回正时的俯仰角，度，正数向下；R3 / 鼠标中键回正。
Tilt=8
; 瞄准镜头额外后移，0–200 厘米；0 不后移，如 60 为后移 60 厘米。
; 不改狙击/火箭筒镜头、固定/载具机枪或体术专用模式。
AimDistance=0
; 普通 FOV 增加的度数，不是最终角度，范围 -15–40；0 原始。
; 原作普通视角通常 45 度，15 即约 60 度。本包 15，上游默认 0。
FieldOfView=15
; 瞄准 FOV 增加的度数，-15–40；本包 10，上游默认 0。
; 不改镜内变焦、固定/载具机枪或体术专用模式。
AimFieldOfView=10
; 角色转向移动方向的速度，度/秒；不是相机灵敏度。
TurnSpeed=720
; 自由相机下向后走：0 转身朝相机走，1 面向原方向倒退；跑步仍转身。
BackStep=0
; 随船、平台的旋转转动相机；0 保持世界朝向。
FollowPlatform=1
; 1 体术中保持自由相机，需要 FreeCamera=1；保留完整 mod 的其他功能。
; 与 [Controls] Mode=MeleeCamera 体术专用模式不同。
MeleeCamera=0
; 1 普通抓取中保持自由镜头；致命抓取、剧情/BOSS 等镜头仍交给游戏。
GrabCamera=0
; 低掩体中转镜头同时转角色；0 只转镜头。需要自由相机。
CoverTurn=1

[Aim]
; 持枪瞄准时可移动。
GunWalk=1
; 持刀时可移动。
KnifeWalk=1
; 非瞄准单键换弹时继续移动；举枪换弹是否移动由 GunWalk 决定。
ReloadWalk=1
; 拔枪/切枪时继续移动。
SwitchWalk=1
; 1 开镜时也可走；手柄 B/D 布局按定位同伴键+左摇杆变焦。
; 键鼠仍用滚轮变焦；0 镜内站定，使用原生变焦操作。
ScopeWalk=0
; 持枪瞄准/持刀的普通步行速度参数，1.0 原作普通步行动画速度。
WalkSpeed=1.125
; 瞄准/持刀时按跑步键切换到的快速步行速度，不是奔跑速度。
FastWalkSpeed=1.875
; 刀攻击速度倍率，1.0 原速，1.5 为 1.5 倍。
KnifeSpeed=1.5
; 中心准星替代激光；键鼠还需 MouseAim=RE3。0 回到原生瞄准显示。
Crosshair=1
; 准星大小，正数 0.25–4；0/负数回到 1.0，不是隐藏准星。
CrosshairSize=1.0
; 准星水平瞄准立即带动视角/角色；0 恢复先动手臂区域，受瞄准模式影响。
DirectHorizontal=1
; 手柄水平/纵向瞄准倍率，正数 0.25–4，叠加游戏内设置；不是鼠标速度。
AimSpeedX=1.0
AimSpeedY=1.0
; 手柄瞄准相机跟随延迟，0–1；0 无拖后，1 原版，0.15 接近鼠标感。
AimCameraLag=0.15
; 开枪时准星张开幅度；0 不张开。只改显示，不等于后坐力/散布。
CrosshairKick=1.0
; 键鼠持刀小准星，0 隐藏；手柄本来没有。
KnifeCrosshair=1
; 手柄呼吸晃动：0 稳定、1 原作；不能保证给鼠标额外增加晃动。
Breathing=0
; 手柄启用类似鼠标的自动武器镜头后坐力；0 不额外启用。
; 游戏原生鼠标后坐力仍保留，本项不是键鼠无后坐力开关。
Recoil=1

[Damage]
; 0 原作动态难度伤害；正值用固定倍率替代原动态缩放，不是再乘一次。
; 1.0 不等于原版；玩家受到的伤害不变。联机同步主机设置。
Damage=0
; 固定 Damage 基础上额外乘给刀；仅 Damage>0 生效，本预设不强化刀伤。
KnifeDamage=2.0
; 枪械射速倍率，正数 0.5–3；1 原速，不影响刀/手雷。
FireRate=1.0
; 霰弹散布 0–1；1 原版、0.5 半宽、0 全部集中。无效值恢复 1。
ShotgunSpread=1.0

[Trainer]
; 单机/离线功能，全部默认关闭，不提供快捷键。游戏运行中修改后通常约一秒生效。
; 不直接编辑存档文件；正常游戏保存可能记录实际背包数值。生命只补满存活角色。
InfiniteHealth=0
; 也补满本机 AI 或分屏队友生命；不会改远程网络玩家副本。
PartnerInfiniteHealth=0
; 保留备用弹药，仍保留正常换弹动画。与 NoReload 可独立使用。
InfiniteAmmo=0
; 保留当前武器弹匣，不再需要换弹；普通换弹动画不会被强行跳过。
NoReload=0
; 投掷时保留手雷堆叠数量；不包括地雷和鸡蛋。
InfiniteGrenades=0

[Movement]
; 非瞄准步行/跑步倍率，正数 0.5–2；1 原速。瞄准步速看 [Aim]。
MoveWalkSpeed=1.0
MoveRunSpeed=1.0

[Visual]
; 去关卡黄滤镜，游戏特殊滤镜仍保留；本包 1，上游默认 0。
NoColorFilter=1

[Performance]
; 本版新增：游戏帧率上限；0 恢复原始限帧计算，或填 30–1000 整数。
; 游戏帧率选 Variable（可变），VSync/外部限帧仍可限制实际帧率。
; 144 是目标上限，不会更改 Windows 显示器刷新率；高帧率仍需实测。
FPSLimit=144

[Advanced]
; 游戏满足启动条件后额外等待的毫秒数，0–60000；3000 为 3 秒。
; 完整性检查失败可尝试 10000，修改后需要重启游戏。
HookDelayMs=3000

[Keyboard]
; 键鼠使用 mod 的相机/移动操作；0 原作键鼠，同时关闭滚轮切枪。
KeyboardMouse=1
; 键盘跑步：Hold 按住，Toggle 按一下切换；与手柄 Run 分开。
Run=Hold
; 鼠标速度倍率，正数 0.1–10，叠加游戏内灵敏度；越大越快。
MouseSensitivity=0.75
; 鼠标纵向相对水平速度，正数 0.1–10；反转在游戏中设置。
MouseVertical=1.0
; RE3 强制中心瞄准；Game 使用游戏选项中选择的原生鼠标瞄准方式。
MouseAim=RE3
; 手柄切回键鼠需约 1/4 秒内达到的鼠标移动计数，0–100000。
; 0 原作规则；按钮/滚轮实际输入可直接切换设备。
MouseSwitchCounts=30
; 本版新增：下滚下一把、上滚上一把，按背包格子顺序跳过空位/非枪械。
; 镜内保留变焦；背包、菜单、失焦、换弹、切枪/特殊动作中丢弃输入。
; 需要完整模式与键鼠控制开启；0 关闭。
MouseWheelWeapons=1

[Coop]
; mod 额外联机同步，建议 1，双方使用兼容版本；0 不会关闭游戏联机。
; 同步主机伤害/刀伤倍率、射速与霰弹散布等，各自 FOV/FPS 独立。
Sync=1
